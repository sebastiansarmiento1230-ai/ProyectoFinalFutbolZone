<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FutbolZone | Sistema de Gestión y Reservas de Canchas</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Detector para cuando se abre directamente index.html con doble clic (file://) -->
    <noscript>
      <div style="font-family: sans-serif; text-align: center; padding: 40px;">
        <h2>JavaScript requerido</h2>
        <p>Por favor habilita JavaScript en tu navegador para usar FutbolZone.</p>
      </div>
    </noscript>

    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            root.innerHTML = '<div style="max-width: 600px; margin: 80px auto; padding: 32px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #f8fafc; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; border: 1px solid #1e293b;">' +
              '<div style="font-size: 48px; margin-bottom: 16px;">⚽</div>' +
              '<h2 style="color: #10b981; margin-top: 0; font-size: 24px;">FutbolZone — Ejecución del Sistema</h2>' +
              '<p style="color: #94a3b8; font-size: 15px; line-height: 1.6;">Has abierto el archivo <code>index.html</code> directamente desde el explorador de archivos (protocolo <code>file://</code>). Las aplicaciones modernas en <strong>React + Vite</strong> no pueden cargar módulos bajo este protocolo por políticas de seguridad del navegador.</p>' +
              '<div style="background: #1e293b; padding: 16px; border-radius: 10px; margin: 24px 0; text-align: left;">' +
                '<strong style="color: #38bdf8; display: block; margin-bottom: 8px;">🚀 Para abrir la aplicación correctamente:</strong>' +
                '<p style="margin: 6px 0; color: #cbd5e1; font-size: 14px;"><strong>Opción 1:</strong> Abre en tu navegador: <a href="http://localhost:5173" style="color: #10b981; font-weight: bold; text-decoration: underline;">http://localhost:5173</a></p>' +
                '<p style="margin: 6px 0; color: #cbd5e1; font-size: 14px;"><strong>Opción 2:</strong> Haz doble clic en el archivo <code>iniciar_proyecto.bat</code> en la raíz del proyecto.</p>' +
              '</div>' +
              '<a href="http://localhost:5173" style="display: inline-block; background: #10b981; color: #042f2e; font-weight: bold; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-size: 15px;">Ir a http://localhost:5173 ➔</a>' +
            '</div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
