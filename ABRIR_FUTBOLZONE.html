<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Abriendo FutbolZone...</title>
  <meta http-equiv="refresh" content="1;url=http://localhost:5173">
  <style>
    body {
      margin: 0;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 90%;
    }
    .ball {
      font-size: 56px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      color: #10b981;
      font-size: 26px;
      margin: 16px 0 8px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #042f2e;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ball">⚽</div>
    <h1>Abriendo FutbolZone...</h1>
    <p>Redirigiendo automáticamente a la aplicación en ejecución...</p>
    <a href="http://localhost:5173" class="btn">Abrir Aplicación Manualmente ➔</a>
  </div>
</body>
</html>
